name: refunddesk
x-app: &app
  build: .
  environment: &env
    APP_ENV: development
    DB_SSLMODE: disable
    DATABASE_URL: postgresql+psycopg://refunddesk:${RD_LOCAL_PG_PASSWORD:?set RD_LOCAL_PG_PASSWORD}@db:5432/refunddesk_dev
  depends_on:
    migrate: {condition: service_completed_successfully}
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: refunddesk_dev
      POSTGRES_USER: refunddesk
      POSTGRES_PASSWORD: ${RD_LOCAL_PG_PASSWORD:?set RD_LOCAL_PG_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, refunddesk, -d, refunddesk_dev]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    depends_on:
      db: {condition: service_healthy}
    command: [alembic, upgrade, head]
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: [python, -m, refunddesk.entrypoints.worker]
  expiry:
    <<: *app
    command: [python, -m, refunddesk.entrypoints.expiry]
  mcp:
    build: .
    command: [uvicorn, refunddesk.entrypoints.mcp:app, --host, 0.0.0.0, --port, "8001"]
    ports: ["127.0.0.1:8001:8001"]
  payment:
    build: .
    command: [uvicorn, refunddesk.entrypoints.payment:app, --host, 0.0.0.0, --port, "8002"]
    ports: ["127.0.0.1:8002:8002"]
volumes:
  pgdata:
