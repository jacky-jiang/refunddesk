name: architecture-rules
on: [push, pull_request]
permissions:
  contents: read
jobs:
  architecture-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/render_ai_rules.py --check
      - run: python -m unittest discover -s tests/rules -v
      - run: python scripts/check_architecture.py
